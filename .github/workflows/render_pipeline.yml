name: HistorySnooze 4K ASMR Video Render Pipeline

on:
  workflow_dispatch:
    inputs:
      project_folder_id:
        description: 'Google Drive Project Folder ID'
        required: true
        type: string
      row_index:
        description: 'Google Sheet Pipeline Row Index (e.g. 5)'
        required: true
        type: string

jobs:
  render_and_assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg 4K
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libx264-dev libmp3lame-dev

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Project Assets from Google Drive
        run: |
          echo "[RENDER] Downloading audio and keyframes from Drive folder: ${{ inputs.project_folder_id }}"
          python3 download_drive_assets.py "${{ inputs.project_folder_id }}" "./project_assets"

      - name: Execute 4K Video Pipeline (Orchestrator)
        run: |
          python3 pipeline_orchestrator.py "./project_assets" "Automatic" 4

      - name: Upload Master MP4 and Chunks Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historysnooze-render-row-${{ inputs.row_index }}
          path: |
            project_assets/03. Final Production/*.mp4
            project_assets/02. Media Generation/video/*.mp4
            project_assets/02. Media Generation/chunks/*.mp4
            output/*.mp4
          retention-days: 14

      - name: Complete Render Pipeline
        env:
          ROW_INDEX: ${{ inputs.row_index }}
        run: |
          echo "=================================================="
          echo "🎉 Video Render Pipeline Complete for Row $ROW_INDEX!"
          echo "Status: Video = Done, Pipeline = Ready"
          echo "=================================================="
